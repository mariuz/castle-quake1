# Native builds: Windows x86_64, Linux x86_64, macOS x86_64 / aarch64 and Android (APK) on GitHub's runners, with
# FPC and the CGE snapshot set up by castle-build-ci (like CGE's own template
# castle-game/.github/workflows/build.yml). The CGE Docker image did the same,
# but Docker Hub's unauthenticated pull rate limit on the shared runner IPs
# kept failing the runs.
#
# - On every push / pull request: build and keep the packages as workflow artifacts.
# - On a tag like v0.1.0: also attach the packages to a GitHub Release.
# - Run manually with a "release_tag" (e.g. v0.2.0): create that tag and the
#   GitHub Release from the chosen branch.
#
# See https://castle-engine.io/github_actions

name: Build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Create a GitHub Release with this tag (e.g. v0.2.0); leave empty to only build'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up FPC and Castle Game Engine
        timeout-minutes: 20
        run: |
          cd /tmp/
          git clone https://github.com/castle-engine/castle-build-ci.git \
            --depth=1 --single-branch --branch=master
          castle-build-ci/install_dependencies
          castle-build-ci/setup_castle_engine

      # tests/quaketests: the BSP tracer, the QuakeC VM, savegame round trips
      # and the demo writer / reader against the bundled shareware pak
      - name: Build and run the unit tests
        run: |
          cd tests
          castle-engine compile --mode=debug --verbose
          ./quaketests ../data/paks

  scenarios:
    name: Gameplay scenarios
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Set up FPC and Castle Game Engine
        timeout-minutes: 20
        run: |
          cd /tmp/
          git clone https://github.com/castle-engine/castle-build-ci.git \
            --depth=1 --single-branch --branch=master
          castle-build-ci/install_dependencies
          castle-build-ci/setup_castle_engine

      - name: Install a virtual display and Pillow
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth libgl1-mesa-dri libglx-mesa0 libopenal1 python3-pil

      # tests/scenarios.py: finishing E1M1, a save / load in the middle of a
      # fight, a host and a client in a deathmatch, QuakeC mode; their logs
      # are checked and screenshots compared with tests/reference/*.png
      - name: Build and run the gameplay scenarios
        run: |
          castle-engine compile --mode=release --verbose
          python3 tests/scenarios.py

      - name: Upload the scenario screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scenarios
          path: castle-engine-output/scenarios
          if-no-files-found: ignore

  # Community maps from Quaddicted (BSP2 with colored light and fog, a large
  # BSP29, another BSP2; fetched by URL and SHA-256, cached): culling must
  # change no pixel, the PVS counts stay within tests/community_budgets.json,
  # QuakeC spawns each level. Not a release gate: it depends on an outside
  # host.
  community-maps:
    name: Community maps
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Set up FPC and Castle Game Engine
        timeout-minutes: 20
        run: |
          cd /tmp/
          git clone https://github.com/castle-engine/castle-build-ci.git \
            --depth=1 --single-branch --branch=master
          castle-build-ci/install_dependencies
          castle-build-ci/setup_castle_engine

      - name: Install a virtual display and Pillow
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth libgl1-mesa-dri libglx-mesa0 libopenal1 python3-pil

      - name: Cache the community map zips
        uses: actions/cache@v4
        with:
          path: ~/community-maps
          key: community-maps-${{ hashFiles('tests/community_maps.py') }}

      - name: Build and play the community maps
        run: |
          castle-engine compile --mode=release --verbose
          COMMUNITY_MAPS_CACHE="$HOME/community-maps" python3 tests/community_maps.py

      - name: Upload the community map logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: community-maps
          path: |
            castle-engine-output/community/*.log
            castle-engine-output/community/*.png
            castle-engine-output/community/community.json
          if-no-files-found: ignore

  build-linux:
    name: Package Linux
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up FPC and Castle Game Engine
        timeout-minutes: 20
        run: |
          cd /tmp/
          git clone https://github.com/castle-engine/castle-build-ci.git \
            --depth=1 --single-branch --branch=master
          castle-build-ci/install_dependencies
          castle-build-ci/setup_castle_engine

      - name: Package Linux (x86_64)
        run: castle-engine package --os=linux --cpu=x86_64 --mode=release --verbose

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: castle-quake1-linux
          path: "*-linux-x86_64.tar.gz"
          if-no-files-found: error

  build-windows:
    name: Package Windows
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Set up FPC and Castle Game Engine
        timeout-minutes: 20
        run: |
          cd /tmp/
          git clone https://github.com/castle-engine/castle-build-ci.git \
            --depth=1 --single-branch --branch=master
          castle-build-ci/install_dependencies
          castle-build-ci/setup_castle_engine

      - name: Package Windows (x86_64)
        run: castle-engine package --os=win64 --cpu=x86_64 --mode=release --verbose

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: castle-quake1-windows
          path: "*-win64-x86_64.zip"
          if-no-files-found: error

  build-macos:
    name: Package macOS (${{ matrix.cpu }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            cpu: x86_64
          - runner: macos-latest
            cpu: aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up FPC and Castle Game Engine
        timeout-minutes: 25
        run: |
          cd /tmp/
          git clone https://github.com/castle-engine/castle-build-ci.git \
            --depth=1 --single-branch --branch=master
          castle-build-ci/install_dependencies
          castle-build-ci/setup_castle_engine

      # Not signed or notarized (no Apple developer certificate): the first
      # start needs right-click > Open, or xattr -dr com.apple.quarantine.
      - name: Package app bundle (zip)
        run: |
          castle-engine package --mode=release --package-format=mac-app-bundle-zip --verbose
          ls -l *.zip

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: castle-quake1-macos-${{ matrix.cpu }}
          path: "*-darwin-*.zip"
          if-no-files-found: error

  # Android: an APK for arm64-v8a and armeabi-v7a. The CGE Docker image has
  # the cross-compilers but Docker Hub's pull limit failed the runs, so FPC
  # 3.2.2 comes from Ubuntu, the CGE build tool is built with it, and
  # tools/android-fpc.sh builds ppcrossarm / ppcrossa64 from the same
  # version's sources (cached) with GNU binutils and the NDK's libraries.
  # Without a release key the build tool signs with the debug key (the APK
  # installs by side-loading; a store upload needs a release key).
  build-android:
    name: Package Android
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install FPC 3.2.2 and the ARM binutils
        run: |
          sudo apt-get update
          sudo apt-get install -y fpc binutils-arm-linux-gnueabi binutils-aarch64-linux-gnu
          fpc -iV

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Castle Game Engine (built with that FPC)
        timeout-minutes: 20
        run: |
          cd /tmp/
          git clone https://github.com/castle-engine/castle-build-ci.git \
            --depth=1 --single-branch --branch=master
          castle-build-ci/install_dependencies
          castle-build-ci/setup_castle_engine --install-fpc=false

      - name: Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "ndk;27.3.13750724" > /dev/null

      - name: Cache the Android cross-compilers
        uses: actions/cache@v4
        with:
          path: ~/android-fpc
          key: android-fpc-${{ runner.os }}-3.2.2-${{ hashFiles('tools/android-fpc.sh') }}

      - name: FPC cross-compilers for Android
        run: tools/android-fpc.sh ~/android-fpc "$ANDROID_HOME/ndk/27.3.13750724"

      - name: Package Android (APK)
        run: |
          source ~/android-fpc/env.sh
          castle-engine package --target=android --mode=release --verbose
          ls -l *.apk

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: castle-quake1-android
          path: "*-android*.apk"
          if-no-files-found: error

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    needs: [test, scenarios, build-linux, build-windows, build-macos, build-android]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: packages
      - name: List packages
        run: ls -l packages
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: |
            packages/*.zip
            packages/*.tar.gz
            packages/*.apk
          generate_release_notes: true
