# Native builds: Windows x86_64, Linux x86_64 and macOS x86_64 / aarch64 on GitHub's runners, with
# FPC and the CGE snapshot set up by castle-build-ci (like CGE's own template
# castle-game/.github/workflows/build.yml). The CGE Docker image did the same,
# but Docker Hub's unauthenticated pull rate limit on the shared runner IPs
# kept failing the runs.
#
# - On every push / pull request: build and keep the packages as workflow artifacts.
# - On a tag like v0.1.0: also attach the packages to a GitHub Release.
# - Run manually with a "release_tag" (e.g. v0.2.0): create that tag and the
#   GitHub Release from the chosen branch.
#
# See https://castle-engine.io/github_actions

name: Build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Create a GitHub Release with this tag (e.g. v0.2.0); leave empty to only build'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up FPC and Castle Game Engine
        timeout-minutes: 20
        run: |
          cd /tmp/
          git clone https://github.com/castle-engine/castle-build-ci.git \
            --depth=1 --single-branch --branch=master
          castle-build-ci/install_dependencies
          castle-build-ci/setup_castle_engine

      # tests/quaketests: the BSP tracer, the QuakeC VM, savegame round trips
      # and the demo writer / reader against the bundled shareware pak
      - name: Build and run the unit tests
        run: |
          cd tests
          castle-engine compile --mode=debug --verbose
          ./quaketests ../data/paks

  build-linux:
    name: Package Linux
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up FPC and Castle Game Engine
        timeout-minutes: 20
        run: |
          cd /tmp/
          git clone https://github.com/castle-engine/castle-build-ci.git \
            --depth=1 --single-branch --branch=master
          castle-build-ci/install_dependencies
          castle-build-ci/setup_castle_engine

      - name: Package Linux (x86_64)
        run: castle-engine package --os=linux --cpu=x86_64 --mode=release --verbose

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: castle-quake1-linux
          path: "*-linux-x86_64.tar.gz"
          if-no-files-found: error

  build-windows:
    name: Package Windows
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Set up FPC and Castle Game Engine
        timeout-minutes: 20
        run: |
          cd /tmp/
          git clone https://github.com/castle-engine/castle-build-ci.git \
            --depth=1 --single-branch --branch=master
          castle-build-ci/install_dependencies
          castle-build-ci/setup_castle_engine

      - name: Package Windows (x86_64)
        run: castle-engine package --os=win64 --cpu=x86_64 --mode=release --verbose

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: castle-quake1-windows
          path: "*-win64-x86_64.zip"
          if-no-files-found: error

  build-macos:
    name: Package macOS (${{ matrix.cpu }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            cpu: x86_64
          - runner: macos-latest
            cpu: aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up FPC and Castle Game Engine
        timeout-minutes: 25
        run: |
          cd /tmp/
          git clone https://github.com/castle-engine/castle-build-ci.git \
            --depth=1 --single-branch --branch=master
          castle-build-ci/install_dependencies
          castle-build-ci/setup_castle_engine

      # Not signed or notarized (no Apple developer certificate): the first
      # start needs right-click > Open, or xattr -dr com.apple.quarantine.
      - name: Package app bundle (zip)
        run: |
          castle-engine package --mode=release --package-format=mac-app-bundle-zip --verbose
          ls -l *.zip

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: castle-quake1-macos-${{ matrix.cpu }}
          path: "*-darwin-*.zip"
          if-no-files-found: error

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    needs: [test, build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: packages
      - name: List packages
        run: ls -l packages
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: |
            packages/*.zip
            packages/*.tar.gz
          generate_release_notes: true
